name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev librsvg2-bin
      - name: Build Debian package
        run: make deb VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/highway_*_amd64.deb

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
            binary_arch: x86_64
          - runner: macos-14
            arch: arm64
            binary_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set application version
        run: perl -0pi -e 's/^Version = ".*"/Version = "${{ github.ref_name }}"/m; s/Version = "v/Version = "/' FyneApp.toml
      - name: Build macOS DMG
        run: make macos-dmg VERSION="${GITHUB_REF_NAME#v}" ARCH="${{ matrix.arch }}"
      - name: Validate macOS DMG
        run: |
          test "$(lipo -archs dist/Highway.app/Contents/MacOS/highway)" = "${{ matrix.binary_arch }}"
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "dist/Highway-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}.dmg"
          test -d "$mount_dir/Highway.app"
          test -L "$mount_dir/Applications"
          hdiutil detach "$mount_dir"
          rmdir "$mount_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Highway-*-macos-*.dmg

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: cd release && sha256sum highway_*_amd64.deb Highway-*-macos-*.dmg > SHA256SUMS && gh release create "$GITHUB_REF_NAME" --generate-notes highway_*_amd64.deb Highway-*-macos-*.dmg SHA256SUMS
